volumes:
  postgres:
  garage-meta:
  garage-data:
  redis:

services:
  postgres:
    container_name: modweave-db
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-production}
      POSTGRES_USER: ${DB_USER:-username}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ../sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../sql/trigger.sql:/docker-entrypoint-initdb.d/02-trigger.sql:ro
    ports:
      - "5432:5432"
    networks:
      - mynetwork

  garage:
    image: dxflrs/garage:v2.0.0
    container_name: modweave-garage
    environment:
      GARAGE_ALLOW_WORLD_READABLE_SECRETS: "true"
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./garage.toml:/etc/garage.toml:ro
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3903:3903"
    command: /garage -c /etc/garage.toml server
    networks:
      - mynetwork

  redis:
    image: redis:7-alpine
    container_name: modweave-redis
    ports:
      - "6379:6379"
    networks:
      - mynetwork
    volumes:
      - redis:/data

networks:
  mynetwork:
    driver: bridge
