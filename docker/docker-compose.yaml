volumes:
  postgres:
  minio:
  redis:

services:
  postgres:
    container_name: modweave-db
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /data/postgres
    volumes:
      - ./postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mynetwork

  minio:
    image: minio/minio:latest
    container_name: modweave-s3
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - ./minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    networks:
      - mynetwork

  redis:
    image: redis:latest
    container_name: modweave-redis
    ports:
      - "6379:6379"
    networks:
      - mynetwork
    volumes:
      - ./redis:/data

networks:
  mynetwork:
    driver: bridge
