volumes:
  postgres:
  seaweedfs:
  redis:

services:
  postgres:
    container_name: modweave-db
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-production}
      POSTGRES_USER: ${DB_USER:-username}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ../sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../sql/trigger.sql:/docker-entrypoint-initdb.d/02-trigger.sql:ro
    ports:
      - "5432:5432"
    networks:
      - mynetwork

  seaweedfs:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: modweave-s3
    volumes:
      - seaweedfs:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "8333:8333"
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
    networks:
      - mynetwork

  redis:
    image: redis:7-alpine
    container_name: modweave-redis
    ports:
      - "6379:6379"
    networks:
      - mynetwork
    volumes:
      - redis:/data

networks:
  mynetwork:
    driver: bridge
