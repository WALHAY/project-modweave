openapi: 3.1.0
info:
  title: ModWeave API
  version: 1.0.0
  description: REST API for publishing, moderating, and distributing game modifications.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
tags:
  - name: Authentication
  - name: Users
  - name: Games
  - name: Categories
  - name: Mods
  - name: Versions
  - name: Moderation
  - name: Comments
  - name: Collections
  - name: Files
paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Access and refresh tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access and refresh tokens
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Refreshed tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/{username}:
    get:
      tags: [Users]
      summary: Get a user
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{username}/mods:
    get:
      tags: [Users]
      summary: List a user's mods
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SortName'
      responses:
        '200':
          description: Mod page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModPage'
  /users/{username}/collections:
    get:
      tags: [Users]
      summary: List a user's collections
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SortName'
      responses:
        '200':
          description: Collection page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPage'
  /users:
    get:
      tags: [Users]
      summary: List users
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: username
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/SortUsername'
      responses:
        '200':
          description: User page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
    post:
      tags: [Users]
      summary: Register a user
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '200':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      tags: [Users]
      summary: Update the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /games:
    get:
      tags: [Games]
      summary: List games
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: name
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/SortName'
      responses:
        '200':
          description: Game page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamePage'
    post:
      tags: [Games]
      summary: Create a game
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GameCreateRequest'
      responses:
        '201':
          description: Created game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /games/{gameId}:
    get:
      tags: [Games]
      summary: Get a game
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Games]
      summary: Delete a game
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Game deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /categories:
    get:
      tags: [Categories]
      summary: List categories
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      tags: [Categories]
      summary: Create a category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Created category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Categories]
      summary: Update a category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Categories]
      summary: Delete a category
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Category deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /mods:
    get:
      tags: [Mods]
      summary: List mods
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: name
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/SortName'
      responses:
        '200':
          description: Mod page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModPage'
    post:
      tags: [Mods]
      summary: Upload a mod with its first version
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ModUploadRequest'
      responses:
        '201':
          description: Created mod
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mod'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /mods/{modId}:
    get:
      tags: [Mods]
      summary: Get a mod
      parameters:
        - $ref: '#/components/parameters/ModId'
      responses:
        '200':
          description: Mod
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mod'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Mods]
      summary: Delete a mod
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ModId'
      responses:
        '200':
          description: Mod deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /mods/{modId}/versions:
    get:
      tags: [Versions]
      summary: List versions for a mod
      description: Guests receive approved versions. The owner and administrators also receive pending and rejected versions.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ModId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SortIdDesc'
      responses:
        '200':
          description: Version page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionPage'
    post:
      tags: [Versions]
      summary: Upload a new mod version
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ModId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VersionUploadRequest'
      responses:
        '201':
          description: Created pending version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /mods/{modId}/versions/{versionId}:
    patch:
      tags: [Moderation]
      summary: Approve or reject a version
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ModId'
        - $ref: '#/components/parameters/VersionId'
        - name: status
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/VersionStatus'
          description: Only APPROVED or REJECTED should be used for moderation.
      responses:
        '200':
          description: Version status changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Versions]
      summary: Delete a mod version
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ModId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: Version deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /comments:
    post:
      tags: [Comments]
      summary: Create a comment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
      responses:
        '200':
          description: Created comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /comments/{commentId}:
    delete:
      tags: [Comments]
      summary: Delete a comment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CommentId'
      responses:
        '200':
          description: Comment deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /collections:
    post:
      tags: [Collections]
      summary: Create a collection
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CollectionCreateRequest'
      responses:
        '200':
          description: Created collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /collections/{collectionId}:
    get:
      tags: [Collections]
      summary: Get a collection
      parameters:
        - $ref: '#/components/parameters/CollectionId'
      responses:
        '200':
          description: Collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Collections]
      summary: Add a mod to a collection
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - name: modId
          in: query
          required: true
          schema: { type: string }
        - name: index
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Collections]
      summary: Delete a collection
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CollectionId'
      responses:
        '200':
          description: Collection deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /collections/{collectionId}/mods:
    get:
      tags: [Collections]
      summary: List mods in a collection
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SortIndex'
      responses:
        '200':
          description: Mod page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModPage'
  /collections/{collectionId}/mods/{modId}:
    delete:
      tags: [Collections]
      summary: Remove a mod from a collection
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/ModId'
      responses:
        '200':
          description: Mod removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /files/{fileId}/download:
    get:
      tags: [Files]
      summary: Download a file
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Binary mod file
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
  /mods/{fileId}/download:
    get:
      tags: [Files]
      summary: Download a file (legacy alias)
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Binary mod file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: true
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      required: true
      schema: { type: integer, minimum: 1, default: 20 }
    SortName:
      name: sort
      in: query
      schema: { type: string, default: name }
    SortUsername:
      name: sort
      in: query
      schema: { type: string, default: username }
    SortIdDesc:
      name: sort
      in: query
      schema: { type: string, default: id }
    SortIndex:
      name: sort
      in: query
      schema: { type: string, default: index }
    Username:
      name: username
      in: path
      required: true
      schema: { type: string }
    GameId:
      name: gameId
      in: path
      required: true
      schema: { type: string }
    ModId:
      name: modId
      in: path
      required: true
      schema: { type: string }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CommentId:
      name: commentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileId:
      name: fileId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Authentication is required or credentials are invalid
    Forbidden:
      description: Authenticated user lacks permission
    NotFound:
      description: Resource not found
    Conflict:
      description: Resource conflicts with an existing resource
  schemas:
    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    TokenResponse:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
    User:
      type: object
      required: [username, name, registerDate]
      properties:
        username: { type: string }
        name: { type: string }
        registerDate: { type: string, format: date-time }
    UserCreateRequest:
      type: object
      required: [username, name, password, email]
      properties:
        username: { type: string, minLength: 3, maxLength: 50, pattern: '^[A-Za-z0-9_-]+$' }
        name: { type: string, maxLength: 100 }
        password: { type: string, format: password, minLength: 8, maxLength: 72 }
        email: { type: string, format: email, maxLength: 320 }
    UserUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, format: password, minLength: 8, maxLength: 72 }
        email: { type: string, format: email, maxLength: 320 }
    Game:
      type: object
      required: [id, name, imagePath]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        imagePath: { type: string }
    GameCreateRequest:
      type: object
      required: [name, image]
      properties:
        name: { type: string }
        description: { type: string }
        image: { type: string, format: binary }
    Category:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
    CategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
    Mod:
      type: object
      required: [id, name, imagePath, creationDate, publisherId, gameId, categories]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        imagePath: { type: string }
        creationDate: { type: string, format: date-time }
        publisherId: { type: string }
        gameId: { type: string }
        categories:
          type: array
          items: { type: string }
    ModUploadRequest:
      type: object
      required: [name, image, versionName, files, gameId]
      properties:
        name: { type: string, minLength: 3, maxLength: 50 }
        description: { type: string }
        image: { type: string, format: binary }
        categories:
          type: array
          items: { type: string }
        versionName: { type: string }
        files:
          type: array
          minItems: 1
          items: { type: string, format: binary }
        gameId: { type: string }
    VersionStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    File:
      type: object
      required: [id, filename, downloads]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        downloads: { type: integer, minimum: 0 }
    Version:
      type: object
      required: [id, files, name, uploadDate, status, modId]
      properties:
        id: { type: string, format: uuid }
        files:
          type: array
          items: { $ref: '#/components/schemas/File' }
        name: { type: string }
        changes: { type: string, nullable: true }
        uploadDate: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/VersionStatus' }
        modId: { type: string }
    VersionUploadRequest:
      type: object
      required: [name, files]
      properties:
        name: { type: string }
        changes: { type: string }
        files:
          type: array
          minItems: 1
          items: { type: string, format: binary }
    Comment:
      type: object
      required: [id, content, publishDate, authorId]
      properties:
        id: { type: string, format: uuid }
        content: { type: string }
        publishDate: { type: string, format: date-time }
        authorId: { type: string }
    CommentCreateRequest:
      type: object
      required: [content, modId]
      properties:
        content: { type: string }
        modId: { type: string }
    Collection:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
    CollectionCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
    PageMetadata:
      type: object
      properties:
        number: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/User' }
    GamePage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Game' }
    ModPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Mod' }
    VersionPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Version' }
    CollectionPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Collection' }
