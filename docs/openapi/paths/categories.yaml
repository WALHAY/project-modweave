categories:
  get:
    tags: [Categories]
    summary: List categories
    parameters:
    - {$ref: ../../openapi.yaml#/components/parameters/IfNoneMatch}
    responses:
      '200':
        description: Categories
        content:
          application/json:
            schema: {$ref: ../../openapi.yaml#/components/schemas/CategoryCollection}
            example:
              items:
              - name: Utility
                description: Quality-of-life mods
                _links:
                  self: {href: /api/v2/categories/Utility, method: GET}
              _links:
                self: {href: /api/v2/categories, method: GET}
        headers:
          Cache-Control: {$ref: ../../openapi.yaml#/components/headers/CacheControl}
          ETag: {$ref: ../../openapi.yaml#/components/headers/ETag}
          Last-Modified: {$ref: ../../openapi.yaml#/components/headers/LastModified}
      '304': {$ref: ../../openapi.yaml#/components/responses/NotModified}
    operationId: listCategories
    security: []
    description: Public operation.
  post:
    tags: [Categories]
    summary: Create a category
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: ../../openapi.yaml#/components/schemas/CategoryRequest}
          examples:
            default: {$ref: ../../openapi.yaml#/components/examples/CategoryRequest}
    responses:
      '201':
        description: Created category
        content:
          application/json:
            schema: {$ref: ../../openapi.yaml#/components/schemas/Category}
            examples:
              default: {$ref: ../../openapi.yaml#/components/examples/Category}
        headers:
          Location:
            description: URI of the created category.
            required: true
            schema: {type: string}
            example: /api/v2/categories/Utility
      '401': {$ref: ../../openapi.yaml#/components/responses/Unauthorized}
      '403': {$ref: ../../openapi.yaml#/components/responses/Forbidden}
      '400': {$ref: ../../openapi.yaml#/components/responses/BadRequest}
      '409': {$ref: ../../openapi.yaml#/components/responses/Conflict}
      '415': {$ref: ../../openapi.yaml#/components/responses/UnsupportedMediaType}
    operationId: createCategory
    description: Administrator access.
categories/{categoryName}:
  get:
    tags: [Categories]
    summary: Get a category
    parameters:
    - {$ref: ../../openapi.yaml#/components/parameters/IfNoneMatch}
    - {$ref: ../../openapi.yaml#/components/parameters/CategoryName}
    responses:
      '200':
        description: Category
        content:
          application/json:
            schema: {$ref: ../../openapi.yaml#/components/schemas/Category}
            examples:
              default: {$ref: ../../openapi.yaml#/components/examples/Category}
        headers:
          Cache-Control: {$ref: ../../openapi.yaml#/components/headers/CacheControl}
          ETag: {$ref: ../../openapi.yaml#/components/headers/ETag}
          Last-Modified: {$ref: ../../openapi.yaml#/components/headers/LastModified}
      '304': {$ref: ../../openapi.yaml#/components/responses/NotModified}
      '404': {$ref: ../../openapi.yaml#/components/responses/NotFound}
      '400': {$ref: ../../openapi.yaml#/components/responses/BadRequest}
    operationId: getCategory
    security: []
    description: Public operation.
  patch:
    tags: [Categories]
    summary: Update a category
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: ../../openapi.yaml#/components/schemas/CategoryPatchRequest}
          examples:
            default: {$ref: ../../openapi.yaml#/components/examples/CategoryPatchRequest}
    responses:
      '200':
        description: Updated category
        content:
          application/json:
            schema: {$ref: ../../openapi.yaml#/components/schemas/Category}
            examples:
              default: {$ref: ../../openapi.yaml#/components/examples/Category}
      '401': {$ref: ../../openapi.yaml#/components/responses/Unauthorized}
      '403': {$ref: ../../openapi.yaml#/components/responses/Forbidden}
      '400': {$ref: ../../openapi.yaml#/components/responses/BadRequest}
      '404': {$ref: ../../openapi.yaml#/components/responses/NotFound}
      '415': {$ref: ../../openapi.yaml#/components/responses/UnsupportedMediaType}
    parameters:
    - {$ref: ../../openapi.yaml#/components/parameters/CategoryName}
    description: Administrator only. Change description while preserving the category name. An explicit null clears
      the description; an empty patch is invalid. Repeating the same patch has the same effect.
    operationId: updateCategory
  delete:
    tags: [Categories]
    summary: Delete a category
    security:
    - bearerAuth: []
    parameters:
    - {$ref: ../../openapi.yaml#/components/parameters/CategoryName}
    responses:
      '401': {$ref: ../../openapi.yaml#/components/responses/Unauthorized}
      '403': {$ref: ../../openapi.yaml#/components/responses/Forbidden}
      '204': {description: Category deleted}
      '400': {$ref: ../../openapi.yaml#/components/responses/BadRequest}
      '404': {$ref: ../../openapi.yaml#/components/responses/NotFound}
    operationId: deleteCategory
    description: Administrator access.
