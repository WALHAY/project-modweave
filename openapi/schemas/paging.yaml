PageMetadata:
  type: object
  properties:
    size: {type: integer, minimum: 1}
    totalElements: {type: integer, format: int64, minimum: 0}
    totalPages: {type: integer, minimum: 0}
    page: {type: integer, minimum: 0}
    empty: {type: boolean}
    _links: {$ref: ../openapi.yaml#/components/schemas/PageLinks}
  required: [size, totalElements, totalPages, page, empty, _links]
  examples:
  - page: 0
    size: 20
    totalElements: 1
    totalPages: 1
    empty: false
    _links:
      self: {href: /api/v2/mods?page=0&size=20, method: GET}
      first: {href: /api/v2/mods?page=0&size=20, method: GET}
      last: {href: /api/v2/mods?page=0&size=20, method: GET}
