# Entry point; edit resource paths and reusable components under openapi/.
openapi: 3.1.0
info:
  title: ModWeave API
  version: 2.1.0
  description: Public REST API for ModWeave. API v1 remains available for existing clients. Public reads need no
    token; mutations require a bearer access token unless stated otherwise. Form bodies and multipart uploads are
    supported directly by Swagger UI. Successful resource and collection representations expose HAL-style HATEOAS
    links in `_links`; clients should follow relation links instead of constructing dependent URLs. Safe GET
    representations expose `Cache-Control`, `ETag`, and `Last-Modified`; clients may send `If-None-Match` and
    receive `304 Not Modified`. Timestamps are local server date-times without a UTC offset (legacy domain model).
  license: {name: MIT, identifier: MIT}
servers:
- {url: /, description: 'Same origin as the API documentation (locally http://localhost:8080)'}
