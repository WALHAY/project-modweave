- {name: Mods, description: Mods resources and operations.}
- {name: Versions, description: Versions resources and operations.}
- {name: Moderation, description: Moderation resources and operations.}
- {name: Comments, description: Comments resources and operations.}
- {name: Collections, description: Collections resources and operations.}
- {name: Files, description: Files resources and operations.}
