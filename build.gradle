plugins {
  id 'org.jetbrains.kotlin.jvm' version '2.3.0' apply false
  id 'com.ncorti.ktfmt.gradle' version '0.25.0' apply false
  id 'org.jetbrains.kotlin.plugin.spring' version '2.3.0' apply false
  id 'org.springframework.boot' version '4.0.5' apply false
  id 'io.spring.dependency-management' version '1.1.7' apply false
}

group = 'git.walhay'
version = '1.0.0'
description = 'Game Modding Platform'
ext.awsSdkVersion = '2.57.2'

allprojects {
  apply plugin: 'org.jetbrains.kotlin.jvm'
  apply plugin: 'org.jetbrains.kotlin.plugin.spring'
  apply plugin: 'io.spring.dependency-management'
  apply plugin: 'com.ncorti.ktfmt.gradle'

  repositories { mavenCentral() }

  java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
  }

  dependencyManagement {
    imports { mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.5' }
  }

  dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'io.github.microutils:kotlin-logging-jvm:3.0.5'
  }

  kotlin {
    compilerOptions {
      freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
    }
  }

  tasks.named('test') { useJUnitPlatform() }
}

apply plugin: 'org.springframework.boot'

dependencies {
  implementation project(':domain')
  implementation project(':persistence')
  implementation project(':api')
  implementation 'org.springframework.boot:spring-boot-starter-data-redis'
  implementation 'org.springframework.boot:spring-boot-starter-cache'

  runtimeOnly 'org.postgresql:postgresql:42.7.3'
  runtimeOnly 'org.webjars:swagger-ui:5.33.1'

  testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
  testImplementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
  testImplementation 'org.springframework.boot:spring-boot-starter-validation'
  testImplementation 'com.atlassian.oai:openapi-request-validator-core:3.0.0'
  testImplementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
  testImplementation 'software.amazon.awssdk:s3'
  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
  testImplementation platform('org.testcontainers:testcontainers-bom:2.0.4')
  testImplementation 'org.testcontainers:testcontainers-postgresql'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources') {
  from('sql') { include 'init.sql', 'storage-cleanup.sql' }
}

apply from: 'gradle/scripts/openapi.gradle'
