plugins {
  id 'org.jetbrains.kotlin.jvm' version '2.3.0' apply false
  id 'com.ncorti.ktfmt.gradle' version '0.25.0' apply false
  id 'org.jetbrains.kotlin.plugin.spring' version '2.2.21' apply false
  id 'org.springframework.boot' version '4.0.5' apply false
  id 'io.spring.dependency-management' version '1.1.7' apply false
  id 'jacoco'
}

apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'org.jetbrains.kotlin.plugin.spring'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'com.ncorti.ktfmt.gradle'
apply plugin: 'org.springframework.boot'

group = 'git.walhay'
version = '0.0.1'
description = 'Game Modding Platform'

allprojects {
  repositories {
    mavenCentral()
  }
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

dependencyManagement {
  imports {
    mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.5'
  }
}

dependencies {
  implementation project(':layers:business-logic')
  implementation project(':layers:data-access')
  implementation project(':layers:ui')

  implementation 'org.jetbrains.kotlin:kotlin-reflect'
  implementation 'io.github.microutils:kotlin-logging-jvm:3.0.5'
  implementation 'org.springframework.boot:spring-boot-starter'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-data-redis'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-cache'

  runtimeOnly 'org.postgresql:postgresql:42.7.3'

  testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
  testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

kotlin {
  compilerOptions {
    freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
  }
}

tasks.named('test') {
  useJUnitPlatform()
  systemProperty 'junit.jupiter.testmethod.order.default',
      'org.junit.jupiter.api.MethodOrderer$Random'
  systemProperty 'junit.jupiter.testclass.order.default',
      'org.junit.jupiter.api.ClassOrderer$Random'
  finalizedBy tasks.named('jacocoTestReport')
}

tasks.register('offlineTest', Test) {
  description = 'Runs unit tests using local dependencies.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform()
  systemProperty 'junit.jupiter.testmethod.order.default',
      'org.junit.jupiter.api.MethodOrderer$Random'
  systemProperty 'junit.jupiter.testclass.order.default',
      'org.junit.jupiter.api.ClassOrderer$Random'
}

tasks.register('randomTest', Test) {
  description = 'Runs all tests in random class and method order.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform()
  systemProperty 'junit.jupiter.testmethod.order.default',
      'org.junit.jupiter.api.MethodOrderer$Random'
  systemProperty 'junit.jupiter.testclass.order.default',
      'org.junit.jupiter.api.ClassOrderer$Random'
  finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
  toolVersion = '0.8.14'
}

jacocoTestReport {
  dependsOn test
  reports {
    xml.required = true
    html.required = true
    csv.required = false
  }
}

subprojects {
  apply plugin: 'org.jetbrains.kotlin.jvm'
  apply plugin: 'org.jetbrains.kotlin.plugin.spring'
  apply plugin: 'io.spring.dependency-management'
  apply plugin: 'com.ncorti.ktfmt.gradle'

  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(25)
    }
  }

  dependencyManagement {
    imports {
      mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.5'
    }

  }

  dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'io.github.microutils:kotlin-logging-jvm:3.0.5'

    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  }

  kotlin {
    compilerOptions {
      freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
    }
  }

  tasks.named('test') {
    useJUnitPlatform()
  }

  apply plugin: 'jacoco'

  jacoco {
    toolVersion = '0.8.14'
  }

  tasks.named('test') {
    systemProperty 'junit.jupiter.testmethod.order.default',
        'org.junit.jupiter.api.MethodOrderer$Random'
    systemProperty 'junit.jupiter.testclass.order.default',
        'org.junit.jupiter.api.ClassOrderer$Random'
    finalizedBy tasks.named('jacocoTestReport')
  }

  tasks.named('jacocoTestReport') {
    reports {
      xml.required = true
      html.required = true
      csv.required = false
    }
  }

}

def coverageProjects = [
  project,
  project(':layers:business-logic'),
  project(':layers:data-access'),
  project(':layers:ui'),
]
tasks.named('jacocoTestReport') {
  classDirectories.setFrom(
      coverageProjects.collect { coverageProject ->
        coverageProject.fileTree(coverageProject.file('build/classes/kotlin/main'))
      })
  sourceDirectories.setFrom(
      coverageProjects.collect { coverageProject ->
        coverageProject.file('src/main/kotlin')
      })
  executionData.setFrom(fileTree(layout.buildDirectory).include('jacoco/*.exec'))
}
