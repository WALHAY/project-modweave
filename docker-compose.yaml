volumes:
  postgres:

services:
  postgres:
    container_name: "modweave-db"
    image: postgres:16
    environment:
      POSTGRES_DB: "production"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      PGDATA: /data/postgres
    volumes:
      - ./postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge