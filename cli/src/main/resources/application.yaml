spring:
  application:
    name: modweave
  jpa:
    hibernate:
      ddl-auto: validate
  cache:
    type: redis
    host: localhost
    port: 6379
    redis:
      time-to-live: 3600000

minio:
  endpoint: http://localhost:9000
  credentials:
    username: username
    password: password
  buckets:
    mods: mods
    images: images

server:
  port: 0
