spring:
  application:
    name: modweave
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  cache:
    type: redis
    redis:
      time-to-live: 3600000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 500MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/production?currentSchema=modweave}
    username: ${DB_USER:username}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

logging:
  level:
    root: INFO
    git.walhay.modweave: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

storage:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    username: ${S3_ACCESS_KEY:username}
    password: ${S3_SECRET_KEY:password}
    region: ${S3_REGION:us-east-1}
    buckets:
      mods: mods
      images: images
  cleanup:
    poll-interval-ms: 1000
    upload-grace-ms: 60000
    retry-delay-ms: 60000
    max-retry-delay-ms: 3600000
    claim-timeout-ms: 300000
    batch-size: 20

server:
  port: 8080

security:
  jwt:
    issuer: modweave
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
