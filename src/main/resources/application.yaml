spring:
  application:
    name: modweave
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true
    mapper:
      allow-coercion-of-scalars: false
  jpa:
    hibernate:
      ddl-auto: validate
  cache:
    type: redis
    redis:
      time-to-live: 1h
      key-prefix: "modweave:domain-v2:"
      cache-null-values: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 500MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/production?currentSchema=modweave}
    username: ${DB_USER:username}
    password: ${DB_PASSWORD:password}

logging:
  file:
    name: ${LOG_FILE:${LOG_PATH:logs}/spring.log}
  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_PATH:logs}/spring-%d{yyyy-MM-dd}.%i.log"
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
  level:
    root: INFO
    git.walhay.modweave: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

storage:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    username: ${S3_ACCESS_KEY:username}
    password: ${S3_SECRET_KEY:password}
    region: ${S3_REGION:us-east-1}
    buckets:
      mods: mods
      images: images
  cleanup:
    poll-interval-ms: 1000
    upload-grace-ms: 60000
    retry-delay-ms: 60000
    max-retry-delay-ms: 3600000
    claim-timeout-ms: 300000
    batch-size: 20

server:
  port: 8080

security:
  jwt:
    issuer: modweave
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d

---
spring:
  config:
    activate:
      on-profile: "dev | default"
logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
---
spring:
  config:
    activate:
      on-profile: prod
logging:
  console:
    enabled: false
  level:
    git.walhay.modweave: INFO
    org.springframework: WARN
    org.hibernate: WARN
---
spring:
  config:
    activate:
      on-profile: test
logging:
  file:
    name: ""
  level:
    git.walhay.modweave: INFO
