spring:
  application:
    name: modweave
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  cache:
    type: redis
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    redis:
      time-to-live: 3600000
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=${DB_SCHEMA:public}
    username: ${DB_USER:username}
    password: ${DP_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

logging:
  level:
    root: INFO
    git.walhay.modweave: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

minio:
  endpoint: ${S3_HOST:http://localhost}:${S3_PORT:9000}
  username: ${S3_ACCESS_KEY:username}
  password: ${S3_SECRET_KEY:password}
  buckets:
    mods: mods
    images: images

server:
  port: ${PORT:8080}
